# Karpenter's NodePools/EC2NodeClasses. The controller itself is
# installed by Terraform (infra/aws/karpenter.tf) because its config is
# infrastructure outputs; what it may launch is ordinary GitOps config.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-nodepools
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/harshit-ojha0324/forge
    targetRevision: main
    path: deploy/karpenter
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5 # CRDs may still be landing on first boot
      backoff:
        duration: 30s
