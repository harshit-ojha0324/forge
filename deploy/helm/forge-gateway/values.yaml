image:
  # ECR path (terraform output `image_prefix`). CI's promote job rewrites
  # repository + tag after every green build on main — this is how a
  # merged commit reaches the cluster.
  repository: ACCOUNT_ID.dkr.ecr.us-east-2.amazonaws.com/forge/gateway
  tag: v1.2
  pullPolicy: IfNotPresent

replicas: 2

service:
  type: ClusterIP
  port: 8080

serviceAccount:
  create: true
  name: gateway
  # Cloud identity hooks, e.g. on GKE:
  #   iam.gke.io/gcp-service-account: <sa>@<project>.iam.gserviceaccount.com
  # EKS Pod Identity needs no annotation (the association lives in AWS).
  annotations: {}

# Rendered into the pod as FORGE_* env. Values here are the GKE defaults;
# docker-compose overrides the same knobs locally.
env:
  FORGE_REDIS_URL: redis://forge-redis:6379/0
  FORGE_PRIMARY_BASE_URL: http://vllm:8000/v1
  FORGE_PRIMARY_MODEL: qwen2.5-3b-instruct
  FORGE_FALLBACK_BASE_URL: http://mock-gemini:8000/v1
  FORGE_FALLBACK_MODEL: gemini-2.0-flash
  FORGE_MAX_CONCURRENCY: "8"
  FORGE_QUEUE_MAX_WAITING: "32"
  FORGE_BREAKER_FAILURE_THRESHOLD: "3"
  FORGE_BREAKER_COOLDOWN_S: "15"
  FORGE_CONNECT_TIMEOUT_S: "1"
  FORGE_TENANTS_FILE: /etc/forge/tenants.yaml

# Secret values (e.g. FORGE_FALLBACK_API_KEY for real Gemini) come from an
# existing Secret so they never live in git.
envFromSecret: ""

# Lab-grade tenant config rendered into a Secret — used only when
# tenantsExistingSecret is empty. Production keys live in a Secret
# created out-of-band (kubectl create secret ... from a git-ignored
# file); git only carries the reference.
tenants:
  - name: smart-city-agents
    api_key: forge-sc-CHANGE-ME
    daily_token_quota: 500000
    weight: 2 # fair-queue share under contention
  - name: demo
    api_key: forge-demo-CHANGE-ME
    daily_token_quota: 100000
tenantsExistingSecret: "forge-tenants-prod"

# Two replicas on spot nodes: never let a drain take both at once.
podDisruptionBudget:
  minAvailable: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

serviceMonitor:
  # Requires the kube-prometheus-stack CRDs (monitoring app).
  enabled: true
  interval: 15s
