# Only the gateway may reach the model server: a direct call would skip
# auth, quotas and fair queueing. Enforced by the VPC CNI network policy
# agent (enableNetworkPolicy in infra/aws/eks.tf), which always admits
# node-IP traffic, so kubelet probes still get through.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vllm
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/part-of: forge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vllm
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: forge-gateway
      ports:
        - port: 8000
