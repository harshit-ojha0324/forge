# The eval-gated pipeline:
#   unit tests -> boot the full stack -> run evals (incl. failover drill)
#   -> only then build & push images, and commit their tag to the Helm
#      values so ArgoCD rolls them out.
# A model or gateway regression that breaks an eval blocks the deploy.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gateway deps
        run: pip install -r services/gateway/requirements-dev.txt
      - name: Unit tests
        run: cd services/gateway && python -m pytest -q

  evals:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Boot the platform
        run: docker compose -f deploy/local/docker-compose.yml up -d --build
      - name: Wait for gateway
        run: timeout 90 bash -c 'until curl -sf http://localhost:8080/healthz; do sleep 2; done'
      - name: Run eval gate (with failover drill)
        run: |
          pip install httpx pyyaml
          python evals/run_evals.py --drill --json eval-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-report.json
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f deploy/local/docker-compose.yml logs gateway --tail 100

  publish:
    # Gated on BOTH unit tests and the eval run. Set the AWS_PUBLISH repo
    # variable to "true" and the AWS_CI_ROLE_ARN secret once the EKS stage
    # is live (docs/aws-setup.md §7).
    if: github.ref == 'refs/heads/main' && vars.AWS_PUBLISH == 'true'
    runs-on: ubuntu-latest
    needs: [test, evals]
    permissions:
      contents: read
      id-token: write # keyless auth to AWS via GitHub OIDC
    outputs:
      image_prefix: ${{ steps.ecr.outputs.registry }}/forge
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # The registry URL contains the account id; masking it would make
          # GitHub silently drop the image_prefix job output.
          mask-aws-account-id: false
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and push images
        env:
          PREFIX: ${{ steps.ecr.outputs.registry }}/forge
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          for svc in gateway mock-llm agent-demo; do
            docker build -t "$PREFIX/$svc:$TAG" -t "$PREFIX/$svc:latest" "services/$svc"
            docker push --all-tags "$PREFIX/$svc"
          done

  promote:
    # Closes the GitOps loop: CI never touches the cluster. It writes the
    # new immutable image tag into the Helm values and commits; ArgoCD
    # sees the commit and rolls it out. Git stays the only deploy path,
    # and every deploy is a revertable commit.
    if: github.ref == 'refs/heads/main' && vars.AWS_PUBLISH == 'true'
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    concurrency: promote # serialize commits to main
    steps:
      - uses: actions/checkout@v4
      - name: Pin the new images in the Helm values
        env:
          PREFIX: ${{ needs.publish.outputs.image_prefix }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          # yq is preinstalled on GitHub's ubuntu runners.
          yq -i '.image.repository = strenv(PREFIX) + "/gateway" | .image.tag = strenv(TAG)' deploy/helm/forge-gateway/values.yaml
          yq -i '.image.repository = strenv(PREFIX) + "/mock-llm" | .image.tag = strenv(TAG)' deploy/helm/mock-llm/values.yaml
          git diff --stat
      - name: Commit (GITHUB_TOKEN pushes do not retrigger CI)
        env:
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/helm
          git diff --cached --quiet && exit 0
          git commit -m "deploy: images ${TAG}"
          git pull --rebase origin main
          git push origin HEAD:main
